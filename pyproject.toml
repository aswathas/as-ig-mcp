[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "as-ig-mcp"
version = "0.1.0"
description = "Instagram MCP server: DMs, posts, insights and realtime events on instagrapi 3.2.8."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aswath" }]
dependencies = [
    "instagrapi==3.2.8",
    "mcp",
    "pycryptodomex",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["as_ig_mcp*"]
