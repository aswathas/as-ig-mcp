[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "as-ig-mcp"
version = "0.1.0"
description = "Instagram MCP server: DMs, posts, insights and realtime events on instagrapi 3.2.8."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Aswath" }]
keywords = ["instagram", "mcp", "social", "dm", "insights"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "instagrapi==3.2.8",
    # mcp 2.x removed FastMCP; our server uses the low-level Server API.
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/aswathas/as-ig-mcp"
Repository = "https://github.com/aswathas/as-ig-mcp"
Issues = "https://github.com/aswathas/as-ig-mcp"

[project.scripts]
as-ig-mcp = "as_ig_mcp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["as_ig_mcp*"]
